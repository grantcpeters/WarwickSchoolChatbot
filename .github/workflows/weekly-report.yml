name: Weekly Usage Report & Eval

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 07:00 UTC — covers the past 7 days
    - cron: "0 7 * * 1"

permissions:
  contents: read
  id-token: write
  issues: write   # needed to open failure issues

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
      AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
      AZURE_SEARCH_INDEX_NAME: ${{ vars.AZURE_SEARCH_INDEX_NAME }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER_RAW: ${{ vars.AZURE_STORAGE_CONTAINER_RAW }}
      AZURE_STORAGE_CONTAINER_PDF: ${{ vars.AZURE_STORAGE_CONTAINER_PDF }}
      LOG_ANALYTICS_WORKSPACE_ID: "ad672a5e-50bc-4694-9ad6-a39d549b24da"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure eval-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "eval-failure" --color "d93f0b" --description "Automated prompt evaluation failure" 2>/dev/null || true

      # ── Step 1: Usage report ──────────────────────────────────────────────
      - name: Run usage report (last 7 days)
        id: usage
        run: |
          python scripts/usage_report.py --hours 168 | tee usage_report.txt
          # Write a markdown version to the step summary
          python - <<'EOF'
          import subprocess, datetime
          with open("usage_report.txt") as f:
              raw = f.read()
          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          summary = f"## Ask Warwick — Weekly Usage Report\n_{now}_\n\n```\n{raw}\n```\n"
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      # ── Step 2: Prompt evaluation ─────────────────────────────────────────
      - name: Run prompt evaluation (last 7 days)
        id: eval
        # exit 2 = FAILs found (handled below); exit 1 = real error (let it fail)
        run: |
          python scripts/eval_live_prompts.py --hours 168 | tee eval_output.txt
          echo "eval_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Write eval results to step summary
        run: |
          python - <<'EOF'
          import os, json
          # Append raw console output
          with open("eval_output.txt") as f:
              raw = f.read()
          summary = f"## Ask Warwick — Prompt Evaluation\n\n```\n{raw}\n```\n"
          # Append structured table if JSON results exist
          try:
              with open("scripts/eval_results.json") as f:
                  data = json.load(f)
              rows = data.get("results", [])
              if rows:
                  summary += "\n### Result Table\n\n"
                  summary += "| Verdict | Scope | Asked | Question |\n"
                  summary += "|---------|-------|-------|----------|\n"
                  icons = {"PASS": "✅", "FAIL": "❌", "WARN": "⚠️"}
                  for r in rows:
                      icon = icons.get(r["verdict"], r["verdict"])
                      q = r["question"].replace("|", "\\|")[:80]
                      summary += f"| {icon} {r['verdict']} | {r['scope']} | {r['count']}x | {q} |\n"
          except Exception:
              pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      # ── Step 3: Open GitHub Issue if there are FAILs ──────────────────────
      - name: Check for failures
        id: check_fails
        run: |
          python - <<'EOF'
          import json, os, sys
          try:
              with open("scripts/eval_results.json") as f:
                  data = json.load(f)
          except Exception:
              print("has_fails=false")
              sys.exit(0)
          fails = [r for r in data.get("results", []) if r["verdict"] == "FAIL"]
          warns = [r for r in data.get("results", []) if r["verdict"] == "WARN"]
          has_fails = "true" if fails else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_fails={has_fails}\n")
              f.write(f"fail_count={len(fails)}\n")
              f.write(f"warn_count={len(warns)}\n")
          # Write issue body to a file so the gh CLI can read it
          if fails:
              lines = ["## Ask Warwick — Prompt Evaluation Failures\n"]
              lines.append(f"**{len(fails)} FAIL(s)** and **{len(warns)} WARN(s)** detected in the weekly eval run.\n")
              lines.append(f"_Evaluation window: last 7 days — {data.get('generated', 'unknown')}_\n")
              lines.append("\n### ❌ Failures\n")
              for r in fails:
                  lines.append(f"**Q:** {r['question']}")
                  lines.append(f"- Scope: `{r['scope']}` | Asked: {r['count']}x")
                  lines.append(f"- Reason: {r['reason']}")
                  answer_snippet = r.get("answer", "")[:300].replace("\n", " ")
                  lines.append(f"- Answer snippet: _{answer_snippet}..._")
                  lines.append("")
              if warns:
                  lines.append("\n### ⚠️ Warnings\n")
                  for r in warns:
                      lines.append(f"**Q:** {r['question']}")
                      lines.append(f"- Scope: `{r['scope']}` | Reason: {r['reason']}")
                      lines.append("")
              lines.append("\n---")
              lines.append("_This issue was opened automatically by the weekly-report workflow._")
              lines.append("Please review and close once resolved.")
              with open("issue_body.md", "w") as f:
                  f.write("\n".join(lines))
          EOF

      - name: Open GitHub Issue for failures
        if: steps.check_fails.outputs.has_fails == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +"%Y-%m-%d")
          TITLE="[Weekly Eval] ${FAIL_COUNT} prompt failure(s) — week of ${WEEK}"
          # Only open if no existing open issue with the same title prefix
          EXISTING=$(gh issue list --label "eval-failure" --state open --json title --jq '.[].title' | grep "\[Weekly Eval\]" || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "${TITLE}" \
              --body-file issue_body.md \
              --label "eval-failure"
          else
            echo "Open eval-failure issue already exists — skipping creation."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAIL_COUNT: ${{ steps.check_fails.outputs.fail_count }}

      - name: Fail workflow if eval produced FAILs
        if: steps.check_fails.outputs.has_fails == 'true'
        run: |
          echo "::error::${FAIL_COUNT} prompt evaluation failure(s) detected. See the opened GitHub Issue for details."
          exit 1
        env:
          FAIL_COUNT: ${{ steps.check_fails.outputs.fail_count }}
