name: Keep Scheduled Workflows Active

on:
  workflow_dispatch:
  schedule:
    # Public repositories disable schedules after 60 days without activity.
    - cron: "17 8 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record repository activity
        run: |
          printf 'Last scheduled keepalive: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keep scheduled workflows active"
          git push
